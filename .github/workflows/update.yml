name: Girar o feed

# O widget da TV busca o feed quando o launcher abre e mostra sempre o
# primeiro item. Girando a ordem de tempos em tempos, cada abertura traz
# uma palavra diferente — sem depender do PC estar ligado.
on:
  schedule:
    - cron: '*/20 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerar vocabulary.xml
        run: node scripts/build.js

      - name: Commitar se mudou
        run: |
          if git diff --quiet -- vocabulary.xml; then
            echo "nada mudou"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add vocabulary.xml
          git commit -m 'Gira o feed'
          git push
